services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    volumes:
      - .:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock
      - media:/var/www/html/public/media   
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_DATABASE: laravel
      DB_USERNAME: user
      DB_PASSWORD: secret
    depends_on:
      - mysql
      - python

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: laravel-node
    working_dir: /var/www/html
    command: [ "npm", "run", "dev" ]
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - php

  python:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: laravel-python
    volumes:
      - ./scripts:/app
      - media:/var/www/html/public/media   # <== ganti ke public/media
    tty: true
    stdin_open: true
    working_dir: /app
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public
      - media:/var/www/html/public/media   # <== ganti ke public/media
    depends_on:
      - php

volumes:
  dbdata:
  media:
